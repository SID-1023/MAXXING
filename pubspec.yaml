name: maxxing
description: "A focus and productivity app with a pixel-art virtual pet."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  http: ^1.6.0
  
  # Replaced discontinued device_apps with its maintained fork
  device_apps_ng: ^3.0.2
  audioplayers: ^6.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/maxxing_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/maxxing_icon.png"
  adaptive_icon_foreground_inset: 16

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/